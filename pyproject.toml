[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pysiebanxico"
version = "0.1.0.dev0"
description = "Independent Python client for Banco de México's SIE API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "guadalupe-castillo", email = "guadalupe.castillo@iieg.gob.mx" }]
keywords = ["banxico", "economics", "mexico", "sie", "time-series"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/guadaloop-07/pysiebanxico"
Documentation = "https://github.com/guadaloop-07/pysiebanxico#readme"
Repository = "https://github.com/guadaloop-07/pysiebanxico"
Issues = "https://github.com/guadaloop-07/pysiebanxico/issues"
Changelog = "https://github.com/guadaloop-07/pysiebanxico/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pysiebanxico"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=pysiebanxico --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pysiebanxico"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pysiebanxico"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_configs = true
